version: "3.9"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentsphere-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:-change-me-at-least-32-characters-long}
      JWT_EXPIRATION_MS: "36000000"
      DB_URL: jdbc:postgresql://db:5432/rentsphere
      DB_USERNAME: rentsphere
      DB_PASSWORD: ${DB_PASSWORD:-rentsphere-prod-password}
      DB_DRIVER: org.postgresql.Driver
      JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?Set RAZORPAY_KEY_ID in .env}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?Set RAZORPAY_KEY_SECRET in .env}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rentsphere-frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: rentsphere-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rentsphere
      POSTGRES_USER: rentsphere
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rentsphere-prod-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentsphere -d rentsphere"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
