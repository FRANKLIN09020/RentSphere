app:
  mail:
    enabled: false
    from: test@rentsphere.local
  security:
    jwt:
      secret: test-super-secret-key-that-is-at-least-32-bytes
      expiration-ms: 3600000
  razorpay:
    key-id: rzp_test_integrationKeyId
    key-secret: test-razorpay-secret-key-at-least-20-chars
    webhook-secret: test-razorpay-webhook-secret

spring:
  datasource:
    url: jdbc:h2:mem:rentsphere-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=USER,USERS;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never

logging:
  level:
    root: WARN
