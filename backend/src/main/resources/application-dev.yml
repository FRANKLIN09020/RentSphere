spring:
  datasource:
    url: jdbc:h2:file:./data/rentsphere-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

app:
  local-admin:
    email: ${LOCAL_ADMIN_EMAIL:admin@rentsphere.local}
    password: ${LOCAL_ADMIN_PASSWORD:RentSphere@2026}
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-secret-key-at-least-32-bytes}
