server:
  port: 8080

spring:
  config:
    # Supports a root .env whether the app starts from the repository root or backend.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  profiles:
    default: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-secret-key-at-least-32-bytes}
      expiration-ms: ${JWT_EXPIRATION_MS:36000000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@rentsphere.local}
  ai:
    groq:
      api-key: ${GROQ_API_KEY:}
      # Override with AI_MODEL to switch providers' models, e.g. a Llama model available on your Groq account.
      model: ${AI_MODEL:openai/gpt-oss-20b}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger/index.html 
