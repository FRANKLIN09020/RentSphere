<rect width="100%" height="100%" fill="#ffffff"/>
<text x='800' y='48' text-anchor='middle' class='title'>UML OPERATIONAL CLASS DIAGRAM</text><text x='800' y='76' text-anchor='middle' class='subtitle'>Complaints, disputes, rent notices, approvals and notifications</text><rect x='45' y='140' width='285' height='250' fill='#fff' stroke='#172554' stroke-width='2.5'/><rect x='45' y='140' width='285' height='44' fill='#dbeafe' stroke='#172554' stroke-width='2.5'/><text x='187.5' y='169' text-anchor='middle' class='label'>Complaint</text><line x1='45' y1='184' x2='330' y2='184' class='association'/><text x='57' y='198' class='tiny'>- tenantId: UUID</text><text x='57' y='222' class='tiny'>- unitId: UUID</text><text x='57' y='246' class='tiny'>- title: String</text><text x='57' y='270' class='tiny'>- status: ComplaintStatus</text><text x='57' y='294' class='tiny'>- aiPriority: String</text><line x1='45' y1='310' x2='330' y2='310' class='association'/><text x='57' y='328' class='tiny'>+ triage()</text><text x='57' y='352' class='tiny'>+ updateStatus()</text><rect x='360' y='140' width='320' height='274' fill='#fff' stroke='#172554' stroke-width='2.5'/><rect x='360' y='140' width='320' height='44' fill='#dbeafe' stroke='#172554' stroke-width='2.5'/><text x='520' y='169' text-anchor='middle' class='label'>DepositDispute</text><line x1='360' y1='184' x2='680' y2='184' class='association'/><text x='372' y='198' class='tiny'>- tenantId: UUID</text><text x='372' y='222' class='tiny'>- agreementId: UUID</text><text x='372' y='246' class='tiny'>- depositAmount: Decimal</text><text x='372' y='270' class='tiny'>- deductedAmount: Decimal</text><text x='372' y='294' class='tiny'>- refundPaidAmount: Decimal</text><text x='372' y='318' class='tiny'>- status: DisputeStatus</text><line x1='360' y1='334' x2='680' y2='334' class='association'/><text x='372' y='352' class='tiny'>+ proposeSettlement()</text><text x='372' y='376' class='tiny'>+ recordRefund()</text><rect x='710' y='140' width='300' height='274' fill='#fff' stroke='#172554' stroke-width='2.5'/><rect x='710' y='140' width='300' height='44' fill='#dbeafe' stroke='#172554' stroke-width='2.5'/><text x='860' y='169' text-anchor='middle' class='label'>RentIncrease</text><line x1='710' y1='184' x2='1010' y2='184' class='association'/><text x='722' y='198' class='tiny'>- tenantId: UUID</text><text x='722' y='222' class='tiny'>- agreementId: UUID</text><text x='722' y='246' class='tiny'>- previousRent: Decimal</text><text x='722' y='270' class='tiny'>- proposedRent: Decimal</text><text x='722' y='294' class='tiny'>- effectiveDate: Date</text><text x='722' y='318' class='tiny'>- status: IncreaseStatus</text><line x1='710' y1='334' x2='1010' y2='334' class='association'/><text x='722' y='352' class='tiny'>+ scheduleNotice()</text><text x='722' y='376' class='tiny'>+ recordResponse()</text><rect x='1040' y='140' width='300' height='250' fill='#fff' stroke='#172554' stroke-width='2.5'/><rect x='1040' y='140' width='300' height='44' fill='#dbeafe' stroke='#172554' stroke-width='2.5'/><text x='1190' y='169' text-anchor='middle' class='label'>ApprovalRequest</text><line x1='1040' y1='184' x2='1340' y2='184' class='association'/><text x='1052' y='198' class='tiny'>- organizationId: UUID</text><text x='1052' y='222' class='tiny'>- requesterEmail: String</text><text x='1052' y='246' class='tiny'>- approverEmail: String</text><text x='1052' y='270' class='tiny'>- type: String</text><text x='1052' y='294' class='tiny'>- status: ApprovalStatus</text><line x1='1040' y1='310' x2='1340' y2='310' class='association'/><text x='1052' y='328' class='tiny'>+ approve()</text><text x='1052' y='352' class='tiny'>+ reject()</text><rect x='560' y='620' width='320' height='274' fill='#fff' stroke='#172554' stroke-width='2.5'/><rect x='560' y='620' width='320' height='44' fill='#dbeafe' stroke='#172554' stroke-width='2.5'/><text x='720' y='649' text-anchor='middle' class='label'>Notification</text><line x1='560' y1='664' x2='880' y2='664' class='association'/><text x='572' y=