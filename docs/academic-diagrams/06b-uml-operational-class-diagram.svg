    .entity{fill:#fff;stroke:#1d4ed8;stroke-width:3}.process{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}
    .store{fill:#f8fafc;stroke:#7c3aed;stroke-width:3}.relationship{fill:#fef3c7;stroke:#b45309;stroke-width:3}
